<text x="620" y="44" font-size="23" fill="#1F2328" font-weight="600" text-anchor="middle">The three-agent pipeline</text>
<text x="620" y="68" font-size="13" fill="#57606A" text-anchor="middle">One instruction. Three contexts. Three rule-sets. Exactly one agent is allowed to write.</text>
